[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-seed-ranker"
version = "0.1.0"
description = "Evidence-based ranking of optical starting points before equal-budget optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpticalSeedRanker contributors" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["optical-design", "lens-design", "zemax", "patents", "ray-tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ojbk557/optical-seed-ranker"
Repository = "https://github.com/ojbk557/optical-seed-ranker"
Issues = "https://github.com/ojbk557/optical-seed-ranker/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2.0"]
dev = ["pytest>=8.0", "mcp>=1.29,<2.0", "ruff>=0.9,<1"]

[project.scripts]
seedranker = "optical_seed_ranker.cli:main"
seedranker-mcp = "optical_seed_ranker.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optical_seed_ranker = ["data/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
