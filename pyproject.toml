[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-seed-ranker"
version = "0.1.0"
description = "Evidence-based ranking of optical starting points before equal-budget optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpticalSeedRanker contributors" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["optical-design", "lens-design", "zemax", "patents", "ray-tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seedranker = "optical_seed_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
