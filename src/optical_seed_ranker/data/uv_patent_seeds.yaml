    title: Compact same-material wide-field low-F-number UV optical system
    lens_type: camera
    conjugate: infinity
    focal_length_mm: 7.77
    focal_length_basis: published
    f_number: 0.97
    f_number_basis: published center-field value; patent states about 0.93 at edge
    full_fov_deg: 130.0
    full_fov_basis: published
    surface_count: 18
    element_count: 8
    asphere_count: 0
    wavelength_min_nm: 250.0
    wavelength_max_nm: 270.0
    reference: https://patents.google.com/patent/CN113504627B/en
    source: curated_patent
    evidence_level: patent_numeric_prescription_unvalidated
    topology: 3 negative menisci / positive biconvex / filter / stop / 4-lens rear group
    published_evidence:
      maximum_spot_rms_radius_um: 121.344
      detector_pixel_um: 125.0
      mtf_at_nyquist: null
      distortion_percent: null
      relative_illumination_percent: null
    known_gaps:
      - Published band covers only 250-270 nm, not the requested 240-320 nm.
      - Published spot size is too coarse to establish MTF at an unspecified Nyquist frequency.
      - A 130-degree ultra-wide layout may use a non-rectilinear mapping; distortion is not published.
      - The published prescription must be checked for sign convention and exact stop placement.
