  - seed_id: CN112162388A
    title: Large-aperture large-field solar-blind UV optical system
    lens_type: camera
    conjugate: infinity
    focal_length_mm: 7.461878
    focal_length_basis: inferred with a first-order ABCD calculation from the published table indices
    f_number: 1.30
    f_number_basis: conservative boundary for the published claim F-number below 1.3
    full_fov_deg: 115.0
    full_fov_basis: conservative boundary for the published claim full field above 115 degrees
    surface_count: 16
    element_count: 7
    asphere_count: 1
    wavelength_min_nm: 250.0
    wavelength_max_nm: 280.0
    reference: https://patents.google.com/patent/CN112162388A/zh
    source: curated_patent
    evidence_level: patent_numeric_prescription_with_inferred_efl_unvalidated
    topology: 3-lens negative front group / filter group / 4-lens positive rear group
    published_evidence:
      image_circle_min_mm: 17.5
      relative_illumination_min_percent: 90.0
      energy_fraction_percent: 80.0
      energy_circle_diameter_mm: 0.18
      transmission_min_percent: 90.0
      mtf_at_nyquist: null
      distortion_percent: null
    known_gaps:
      - The focal length is inferred rather than explicitly stated in the publication.
      - The table gives refractive indices but not an unambiguous surface-by-surface glass-catalog mapping.
      - Filter-group media and the final image-space thickness are not given in the table.
      - Published band covers only 250-280 nm, not the requested 240-320 nm.
      - Energy concentration does not establish MTF at Nyquist or distortion below 3 percent.
    prescription:
      units: mm
      glass_note: Patent permits fused silica or CaF2; table indices are retained without guessing catalog glasses.
      surfaces:
