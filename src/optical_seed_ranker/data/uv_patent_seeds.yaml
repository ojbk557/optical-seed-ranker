schema_version: 1
dataset_name: wide-field UV patent starting structures
dataset_warning: >-
  These records reproduce public patent metadata and, where available, numerical
  prescriptions. They are unvalidated starting structures, not qualified optical
  designs. Sign conventions, stop definition, glass catalogs, coatings, detector
  window, and image plane must be checked in optical-design software.

seeds:
